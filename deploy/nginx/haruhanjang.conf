# 참고용: 공용 Nginx(p2.sumzip.com)의 기존 설정은 192.168.0.19:9502 로 프록시한다.
# 단독 서버에 배포할 때의 예시 (TLS 인증서 경로는 환경에 맞게 바꾼다)
server {
  listen 443 ssl http2;
  server_name p2.sumzip.com;
  ssl_certificate     /etc/letsencrypt/live/p2.sumzip.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/p2.sumzip.com/privkey.pem;

  location = /sw.js { proxy_pass http://192.168.0.19:9502; add_header Cache-Control "no-cache"; }
  location / {
    proxy_pass http://192.168.0.19:9502;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
